name: Integrar módulos de Gestión en index

on:
  push:
    branches: ["main"]
    paths:
      - "gestion-hardening.js"
      - "gestion-academy-v2.js"
      - ".github/workflows/commit-index-modules.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrar módulos de forma idempotente
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          markers = [
              '<script src="gestion-hardening.js" defer></script>',
              '<script src="gestion-academy-v2.js" defer></script>',
          ]
          if '</body>' not in s:
              raise SystemExit('No se encontró </body> en index.html')
          missing = [m for m in markers if m not in s]
          if missing:
              block = ''.join(f'  {m}\n' for m in missing)
              s = s.replace('</body>', f'{block}</body>', 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Guardar cambio si fue necesario
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html ya contiene los módulos"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore: integrar módulos seguros en index"
          git push origin HEAD:main
