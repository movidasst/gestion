name: Aplicar logo oficial en Gestión

on:
  push:
    paths:
      - '.github/workflows/aplicar-logo-oficial.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-brand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copiar exactamente el logo usado en www.movidasst.com
        shell: bash
        run: |
          mkdir -p assets
          curl -fsSL 'https://raw.githubusercontent.com/movidasst/principal/main/logo-oficial-movida-sst-plus.png' -o assets/logo-oficial-movida-sst-plus.png

      - name: Actualizar pantallas, demo y correos
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          public_logo = 'https://www.movidasst.com/logo-oficial-movida-sst-plus.png'
          local_logo = '/assets/logo-oficial-movida-sst-plus.png'

          # Pantalla principal de Gestión.
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          text = text.replace('assets/logo-oficial-movida-sst-plus.png', local_logo)
          text = text.replace('assets/logo-movida-sst-plus.png', local_logo)
          text = text.replace('//assets/logo-oficial-movida-sst-plus.png', local_logo)
          if 'rel="icon"' not in text:
              needle = '<meta name="description" content="Centro administrativo privado de integrantes de La Movida SST Plus.">'
              insert = needle + '\n  <link rel="icon" type="image/png" href="/assets/logo-oficial-movida-sst-plus.png">\n  <link rel="preload" as="image" href="/assets/logo-oficial-movida-sst-plus.png" fetchpriority="high">'
              text = text.replace(needle, insert)
          p.write_text(text, encoding='utf-8')

          # Pantalla de Demos, corrigiendo rutas relativas.
          p = Path('demos/index.html')
          if p.exists():
              text = p.read_text(encoding='utf-8')
              text = text.replace('../assets/logo-oficial-movida-sst-plus.png', '/assets/logo-oficial-movida-sst-plus.png')
              text = text.replace('..//assets/logo-oficial-movida-sst-plus.png', '/assets/logo-oficial-movida-sst-plus.png')
              text = text.replace('../assets/logo-movida-sst-plus.png', '/assets/logo-oficial-movida-sst-plus.png')
              p.write_text(text, encoding='utf-8')

          # Correos reales enviados por Apps Script: URL pública absoluta del mismo logo de principal.
          p = Path('AppsScript_Correo_Actualizado.js')
          text = p.read_text(encoding='utf-8')
          import re
          text = re.sub(r"const LOGO_URL\s*=\s*\n\s*'[^']+';", "const LOGO_URL =\n  'https://www.movidasst.com/logo-oficial-movida-sst-plus.png';", text, count=1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Verificar
        shell: bash
        run: |
          echo '=== INDEX ==='
          grep -nEi 'logo-oficial-movida-sst-plus|logo-movida-sst-plus' index.html || true
          echo '=== DEMOS ==='
          grep -nEi 'logo-oficial-movida-sst-plus|logo-movida-sst-plus' demos/index.html || true
          echo '=== CORREOS ==='
          grep -nEi 'LOGO_URL|logo-oficial-movida-sst-plus|logo-movida-sst-plus' AppsScript_Correo_Actualizado.js || true

      - name: Commit y push
        shell: bash
        run: |
          git config user.name 'movidasst'
          git config user.email 'info@movidasst.com'
          git add assets/logo-oficial-movida-sst-plus.png index.html demos/index.html AppsScript_Correo_Actualizado.js
          if git diff --cached --quiet; then
            echo 'No hay cambios pendientes.'
            exit 0
          fi
          git commit -m 'Actualizar logo oficial en todas las pantallas y correos'
          git push
