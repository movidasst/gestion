name: Actualizar logo oficial

on:
  push:
    paths:
      - '.github/workflows/actualizar-logo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Escribir nuevo logo oficial
        shell: bash
        run: |
          echo '' | base64 --decode > assets/logo-oficial-movida-sst-plus.png

      - name: Confirmar cambio
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/logo-oficial-movida-sst-plus.png
          if git diff --cached --quiet; then
            echo 'El logo ya estaba actualizado.'
            exit 0
          fi
          git commit -m 'Actualizar logo oficial de La Movida SST Plus'
          git push
