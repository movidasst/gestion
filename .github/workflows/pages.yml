name: Publicar Centro de Gestión

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Validar archivos esenciales
        shell: bash
        run: |
          test -f index.html
          test -f CNAME
          test -f assets/logo-oficial-movida-sst-plus.png
          test -f gestion-hardening.js
          test -f gestion-academy-v2.js

      - name: Inyectar mejoras modulares
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          markers = [
              '<script src="gestion-hardening.js" defer></script>',
              '<script src="gestion-academy-v2.js" defer></script>',
          ]
          if '</body>' not in s:
              raise SystemExit('No se encontró </body> en index.html')
          missing = [m for m in markers if m not in s]
          if missing:
              block = ''.join(f'  {m}\n' for m in missing)
              s = s.replace('</body>', f'{block}</body>', 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Verificar inyección
        shell: bash
        run: |
          grep -q 'gestion-hardening.js' index.html
          grep -q 'gestion-academy-v2.js' index.html

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Preparar sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
