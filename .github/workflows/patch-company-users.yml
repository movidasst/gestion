name: Patch company user management UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch index
        run: python scripts/patch_company_users.py
      - name: Validate
        run: |
          grep -q 'companyMoodleLookup' index.html
          grep -q 'moodle-company-user-search' index.html
          grep -q 'Agregar participante' index.html
      - name: Commit
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: add manual and existing Moodle user flow for companies"
          git push
