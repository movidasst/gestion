name: Patch company academic Moodle service
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/patch_company_academic_service.py
      - run: |
          grep -q "moodle-company-admin" index.html
          grep -q "MOODLE_LECTURA_TOKEN" supabase/functions/moodle-company-user-search/index.ts
          grep -q "MOODLE_LECTURA_TOKEN" supabase/functions/moodle-company-admin/engine.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html supabase/functions/moodle-company-admin supabase/functions/moodle-company-user-search/index.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: route company Moodle operations through academic service"
          git push
