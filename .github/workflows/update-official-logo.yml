name: Actualizar logo oficial Gestion

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-official-logo.yml'

permissions:
  contents: write

jobs:
  update-logo:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Descargar logo oficial autorizado
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 \
            https://raw.githubusercontent.com/movidasst/geo/main/logo-oficial-movida-sst-plus.png \
            -o assets/logo-oficial-movida-sst-plus.png

      - name: Verificar PNG
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('assets/logo-oficial-movida-sst-plus.png')
          data=p.read_bytes()
          assert data[:8] == b'\x89PNG\r\n\x1a\n', 'El archivo descargado no es PNG válido'
          assert len(data) > 100000, 'El logo descargado parece incompleto'
          print('Logo verificado:', len(data), 'bytes')
          PY

      - name: Actualizar solo referencias de marca
        run: |
          python - <<'PY'
          from pathlib import Path

          index=Path('index.html')
          text=index.read_text(encoding='utf-8')
          old='assets/logo-movida-sst-plus.png'
          new='assets/logo-oficial-movida-sst-plus.png'
          count=text.count(old)
          if count < 3:
              raise SystemExit(f'Se esperaban al menos 3 referencias del logo anterior en index.html y se encontraron {count}')
          text=text.replace(old,new)
          index.write_text(text,encoding='utf-8')

          apps=Path('AppsScript_Correo_Actualizado.js')
          apptext=apps.read_text(encoding='utf-8')
          old_url='https://raw.githubusercontent.com/movidasst/gestion/main/assets/logo-movida-sst-plus.png'
          new_url='https://raw.githubusercontent.com/movidasst/gestion/main/assets/logo-oficial-movida-sst-plus.png'
          if old_url not in apptext:
              raise SystemExit('No se encontró la referencia anterior LOGO_URL en AppsScript_Correo_Actualizado.js')
          apptext=apptext.replace(old_url,new_url)
          apps.write_text(apptext,encoding='utf-8')
          print('Referencias visuales actualizadas en index.html:', count)
          PY

      - name: Verificar que no se alteró la lógica
        run: |
          set -euo pipefail
          grep -q 'assets/logo-oficial-movida-sst-plus.png' index.html
          grep -q 'assets/logo-oficial-movida-sst-plus.png' AppsScript_Correo_Actualizado.js
          test -s assets/logo-oficial-movida-sst-plus.png
          git diff --check
          git diff --stat

      - name: Publicar actualización
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html AppsScript_Correo_Actualizado.js assets/logo-oficial-movida-sst-plus.png
          if git diff --cached --quiet; then
            echo 'No hay cambios pendientes.'
            exit 0
          fi
          git commit -m 'Actualiza logo oficial en Centro de Gestion'
          git push
