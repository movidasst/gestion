name: Fix Moodle capability detection
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fix_moodle_capabilities.py
      - run: |
          grep -q 'core_user_get_users' supabase/functions/moodle-company-user-search/index.ts
          grep -q 'COMPANY_ENROL_FUNCTIONS' supabase/functions/moodle-company-admin/engine.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/moodle-company-admin/engine.ts supabase/functions/moodle-company-user-search/index.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: verify Moodle company capabilities without site info"
          git push
