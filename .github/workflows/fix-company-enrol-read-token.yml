name: Fix company enrol read token
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fix_company_enrol_read_token.py
      - run: |
          grep -q 'callMoodlePrimaryRead("core_enrol_get_enrolled_users"' supabase/functions/moodle-company-admin/engine.ts
          grep -q 'callMoodlePrimaryRead("core_enrol_get_enrolled_users"' supabase/functions/moodle-company-user-search/index.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/moodle-company-admin/engine.ts supabase/functions/moodle-company-user-search/index.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: verify company enrolments with primary Moodle read token"
          git push
